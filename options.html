<!DOCTYPE html>
<html>
<head>
  <title>Extension Settings</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    input { width: 300px; padding: 8px; margin-right: 10px; }
    button { padding: 8px 15px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    #status { margin-top: 10px; font-style: italic; color: green; }
  </style>
</head>
<body>
  <h2>Extension Settings</h2>
  <label for="filterString">Filter String:</label><br><br>
  <input type="text" id="filterString" placeholder="Enter your filter...">
  <button id="save">Save</button>
  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
