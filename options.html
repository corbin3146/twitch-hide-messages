<!DOCTYPE html>
<html style="color-scheme: light dark;">
<head>
  <title>Extension Settings</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    input { width: 300px; padding: 8px; margin-right: 10px; }
    button { padding: 8px 15px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    #status { margin-top: 10px; font-style: italic; color: green; }
  </style>
</head>
<body>
  <h2>Extension Settings</h2>
  <label for="DisabledOnModView">Disabled On Mod View  </label>
  <input type="checkbox" id="DisabledOnModView" value = 'Disabled'>

  <br><br><label for="DisabledOnRegularView">Disbled On Normal View</label>
  <input type="checkbox" id="DisabledOnRegularView" value = 'Disabled'>
  
  <br><br><label for="filterJSON_TextArea">Filter JSON:</label><br><br>
  <textarea 
      id="filterJSON_TextArea" 
      placeholder="Refresh probably reloads your filter"
      rows="50" cols="120" style="overflow-y: scroll;"></textarea>
  <br>
  <button id="save">Save</button>
  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
